<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>네이버 상품명 · 키워드 최적화</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #777; margin-bottom: 24px; font-size: 13px; }
  .card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-bottom: 20px; background: #fff; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #03c75a; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #02b350; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary { background: #555; }
  button.secondary:hover { background: #333; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  th, td { border: 1px solid #eee; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f7f7f7; }
  .kw-tag { display: inline-block; background: #f0f7f2; border: 1px solid #cdebd8; border-radius: 12px; padding: 2px 8px; margin: 2px; font-size: 12px; }
  .vol { color: #03c75a; font-weight: bold; }
  .loading { color: #888; font-size: 13px; margin-top: 8px; }
  .file-row { display: flex; align-items: center; gap: 10px; }
  select#engineSelect, select#engineSelectBulk { padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; }
</style>
</head>
<body>

<h1>네이버 상품명 · 키워드 최적화 도구</h1>
<div class="sub">상품명을 입력하면 축약된 메인 키워드 상품명과, 네이버 검색광고 API로 실제 검색량을 검증한 연관 키워드 10개 이상을 추출합니다.</div>

<div class="card">
  <div class="row">
    <input type="text" id="singleInput" placeholder="기존 상품명을 입력하세요 (예: 반려동물 방수 레인 스노우 부츠 소형견)">
    <select id="engineSelect">
      <option value="claude" selected>Claude Haiku (유료, 건당 약 4원)</option>
      <option value="gemini">Gemini (무료, 일 20회 한도)</option>
    </select>
    <button id="singleBtn" onclick="runSingle()">변환</button>
  </div>
  <div class="loading" id="singleLoading" style="display:none;">처리 중입니다... (AI 추론 + 네이버 검색량 조회)</div>
</div>

<div class="card">
  <div class="file-row">
    <input type="file" id="bulkFile" accept=".xlsx,.xls">
    <select id="engineSelectBulk">
      <option value="claude" selected>Claude Haiku (유료, 건당 약 4원)</option>
      <option value="gemini">Gemini (무료, 일 20회 한도)</option>
    </select>
    <button id="bulkBtn" onclick="runBulk()">엑셀 일괄 처리</button>
    <button class="secondary" onclick="exportExcel()" id="exportBtn" disabled>결과 엑셀로 저장</button>
  </div>
  <div class="sub" style="margin-top:8px;">엑셀에 "상품명" 이라는 헤더가 있는 컬럼(없으면 첫번째 컬럼)을 읽습니다. Gemini는 무료지만 하루 20건 한도가 있어, 대량 처리는 Claude를 권장합니다.</div>
  <div class="loading" id="bulkLoading" style="display:none;">일괄 처리 중입니다... 상품 수에 따라 시간이 걸릴 수 있습니다.</div>
</div>

<div class="card">
  <table id="resultTable">
    <thead>
      <tr>
        <th style="width:18%">기존 상품명</th>
        <th style="width:18%">최적화된 상품명</th>
        <th style="width:10%">상품명 검색량</th>
        <th>추출 키워드 (검색량순)</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
let results = [];

function renderResults() {
  const body = document.getElementById('resultBody');
  body.innerHTML = '';
  for (const r of results) {
    const tr = document.createElement('tr');
    const kwHtml = (r.keywords || []).map(k => `<span class="kw-tag">${k.keyword} <span class="vol">${k.total}</span></span>`).join(' ');
    tr.innerHTML = `
      <td>${r.original_name}</td>
      <td><b>${r.optimized_name}</b></td>
      <td>PC ${r.optimized_name_pc ?? 0} / M ${r.optimized_name_mobile ?? 0}</td>
      <td>${kwHtml}</td>
    `;
    body.appendChild(tr);
  }
  document.getElementById('exportBtn').disabled = results.length === 0;
}

async function runSingle() {
  const input = document.getElementById('singleInput');
  const name = input.value.trim();
  if (!name) return;
  const btn = document.getElementById('singleBtn');
  const loading = document.getElementById('singleLoading');
  btn.disabled = true;
  loading.style.display = 'block';
  try {
    const provider = document.getElementById('engineSelect').value;
    const res = await fetch('/api/optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_name: name, provider }),
    });
    if (!res.ok) {
      alert('오류: ' + await errorText(res));
      return;
    }
    const data = await res.json();
    results.unshift(data);
    renderResults();
    input.value = '';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

// 엑셀 일괄 처리: 서버가 작업 번호를 바로 돌려주고 뒤에서 처리하면, 3초마다 진행 상황과 새 결과를 받아온다.
// (한 요청으로 끝까지 기다리면 100초에서 끊겨 결과가 버려지기 때문)
const JOB_KEY = 'bulkJob';

function saveJob(job) { try { localStorage.setItem(JOB_KEY, JSON.stringify(job)); } catch (e) {} }
function loadJob() { try { return JSON.parse(localStorage.getItem(JOB_KEY) || 'null'); } catch (e) { return null; } }
function clearJob() { try { localStorage.removeItem(JOB_KEY); } catch (e) {} }

async function errorText(res) {
  const err = await res.json().catch(() => null);
  return (err && err.detail) || `서버 응답 ${res.status} ${res.statusText}`;
}

async function runBulk() {
  const fileInput = document.getElementById('bulkFile');
  if (!fileInput.files.length) { alert('엑셀 파일을 선택하세요.'); return; }
  const btn = document.getElementById('bulkBtn');
  btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', fileInput.files[0]);
    fd.append('provider', document.getElementById('engineSelectBulk').value);
    const res = await fetch('/api/optimize/bulk', { method: 'POST', body: fd });
    if (!res.ok) { alert('오류: ' + await errorText(res)); btn.disabled = false; return; }
    const { job_id, total } = await res.json();
    saveJob({ id: job_id, total });
    await pollJob(job_id, total);
  } catch (e) {
    alert('오류: ' + e);
    btn.disabled = false;
  }
}

async function pollJob(jobId, total) {
  const btn = document.getElementById('bulkBtn');
  const loading = document.getElementById('bulkLoading');
  btn.disabled = true;
  loading.style.display = 'block';
  loading.textContent = `일괄 처리 중... 0 / ${total}건 (이 창을 닫거나 새로고침해도 이어서 받아옵니다)`;
  const before = results;   // 이번 작업 전 결과는 아래에 유지
  const jobResults = [];
  let failures = 0;
  try {
    while (true) {
      let data;
      try {
        const res = await fetch(`/api/jobs/${jobId}?since=${jobResults.length}`);
        if (res.status === 404) { alert('오류: ' + await errorText(res)); clearJob(); break; }
        if (!res.ok) throw new Error(await errorText(res));
        data = await res.json();
        failures = 0;
      } catch (e) {
        // 일시적인 네트워크 오류는 잠시 후 다시 시도 (무료 서버가 깨어나는 중일 수도 있음)
        if (++failures >= 20) { alert('서버와 연결이 계속 안 됩니다. 잠시 후 새로고침하면 이어서 받아옵니다.\n' + e); break; }
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
      jobResults.push(...data.results);
      results = jobResults.concat(before);
      renderResults();
      loading.textContent = `일괄 처리 중... ${data.done} / ${data.total}건 (이 창을 닫거나 새로고침해도 이어서 받아옵니다)`;
      if (data.status !== 'running') {
        clearJob();
        if (data.status === 'failed') alert('일괄 처리 중단: ' + data.error + '\n처리된 결과는 화면에 남아 있고 엑셀로 저장할 수 있습니다.');
        break;
      }
      await new Promise(r => setTimeout(r, 3000));
    }
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

// 새로고침/재접속 시 진행 중이던 작업이 있으면 이어서 받아오기
window.addEventListener('load', () => {
  const job = loadJob();
  if (job && job.id) pollJob(job.id, job.total);
});

async function exportExcel() {
  const res = await fetch('/api/export/excel', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ results }),
  });
  if (!res.ok) { alert('엑셀 생성 실패'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'optimized_products.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('singleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runSingle();
});
</script>

</body>
</html>
